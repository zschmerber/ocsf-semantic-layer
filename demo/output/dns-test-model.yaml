    description: The timestamp indicating when the scan job began execution.
    type: timestamp
    ocsf_mapping:
      field: malware_scan_info.start_time_dt
    is_dimension: true
  - name: status_detail
    caption: Status Detail
    description: The status detail contains additional information about the event/finding outcome.
    type: string
    ocsf_mapping:
      field: status_detail
    is_dimension: true
  - name: severity
    caption: Severity
    description: The event/finding severity, normalized to the caption of the <code>severity_id</code> value. In the case of 'Other', it is defined by the source.
    type: string
    ocsf_mapping:
      field: severity
    is_dimension: true
  - name: query_time
    caption: Query Time
    description: The Domain Name System (DNS) query time.
    type: timestamp
    ocsf_mapping:
      field: query_time
    is_dimension: true
  - name: raw_data
    caption: Raw Data
    description: The raw event/finding data as received from the source.
    type: string
    ocsf_mapping:
      field: raw_data
    is_dimension: false
  - name: answers_class
    caption: Resource Record Class
    description: 'The class of DNS data contained in this resource record. See <a target=''_blank'' href=''https://www.rfc-editor.org/rfc/rfc1035.txt''>RFC1035</a>. For example: <code>IN</code>.'
    type: string
    ocsf_mapping:
      field: answers[].class
    is_dimension: false
  - name: answers_type
    caption: Resource Record Type
    description: 'The type of data contained in this resource record. See <a target=''_blank'' href=''https://www.rfc-editor.org/rfc/rfc1035.txt''>RFC1035</a>. For example: <code>CNAME</code>.'
    type: string
    ocsf_mapping:
      field: answers[].type
    is_dimension: false
  - name: answers_ttl
    caption: TTL
    description: The time interval that the resource record may be cached. Zero value means that the resource record can only be used for the transaction in progress, and should not be cached.
    type: integer
    ocsf_mapping:
      field: answers[].ttl
    is_dimension: false
  - name: answers_flag_ids
    caption: DNS Header Flags
    description: The list of DNS answer header flag IDs.
    type: !array integer
    ocsf_mapping:
      field: answers[].flag_ids[]
    is_dimension: true
  - name: answers_flags
    caption: DNS Header Flags
    description: The list of DNS answer header flags.
    type: !array string
    ocsf_mapping:
      field: answers[].flags[]
    is_dimension: false
  - name: answers_packet_uid
    caption: Packet UID
    description: The DNS packet identifier assigned by the program that generated the query. The identifier is copied to the response.
    type: integer
    ocsf_mapping:
      field: answers[].packet_uid
    is_dimension: true
  - name: answers_rdata
    caption: DNS RData
    description: The data describing the DNS resource. The meaning of this data depends on the type and class of the resource record.
    type: string
    ocsf_mapping:
      field: answers[].rdata
    is_dimension: true
  - name: query_time_dt
    caption: Query Time
    description: The Domain Name System (DNS) query time.
    type: timestamp
    ocsf_mapping:
      field: query_time_dt
    is_dimension: true
  - name: start_time_dt
    caption: Start Time
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
    type: timestamp
    ocsf_mapping:
      field: start_time_dt
    is_dimension: true
  - name: action_id
    caption: Action ID
    description: The action taken by a control or other policy-based system leading to an outcome or disposition. An unknown action may still correspond to a known disposition. Refer to <code>disposition_id</code> for the outcome of the action.
    type: integer
    ocsf_mapping:
      field: action_id
    is_dimension: true
  - name: firewall_rule_category
    caption: Category
    description: The rule category.
    type: string
    ocsf_mapping:
      field: firewall_rule.category
    is_dimension: false
  - name: firewall_rule_rate_limit
    caption: Rate Limit
    description: The rate limit for a rate-based rule.
    type: integer
    ocsf_mapping:
      field: firewall_rule.rate_limit
    is_dimension: false
  - name: firewall_rule_type
    caption: Type
    description: The rule type.
    type: string
    ocsf_mapping:
      field: firewall_rule.type
    is_dimension: false
  - name: firewall_rule_name
    caption: Name
    description: The name of the rule that generated the event.
    type: string
    ocsf_mapping:
      field: firewall_rule.name
    is_dimension: true
  - name: firewall_rule_match_details
    caption: Match Details
    description: 'The data in a request that rule matched. For example: ''["10","and","1"]''.'
    type: !array string
    ocsf_mapping:
      field: firewall_rule.match_details[]
    is_dimension: false
  - name: firewall_rule_desc
    caption: Description
    description: The description of the rule that generated the event.
    type: string
    ocsf_mapping:
      field: firewall_rule.desc
    is_dimension: false
  - name: firewall_rule_duration
    caption: Duration Milliseconds
    description: The rule response time duration, usually used for challenge completion time.
    type: integer
    ocsf_mapping:
      field: firewall_rule.duration
    is_dimension: false
  - name: firewall_rule_uid
    caption: Unique ID
    description: The unique identifier of the rule that generated the event.
    type: string
    ocsf_mapping:
      field: firewall_rule.uid
    is_dimension: true
  - name: firewall_rule_version
    caption: Version
    description: 'The rule version. For example: <code>1.1</code>.'
    type: string
    ocsf_mapping:
      field: firewall_rule.version
    is_dimension: false
  - name: firewall_rule_sensitivity
    caption: Sensitivity
    description: 'The sensitivity of the firewall rule in the matched event. For example: HIGH.'
    type: string
    ocsf_mapping:
      field: firewall_rule.sensitivity
    is_dimension: false
  - name: firewall_rule_match_location
    caption: Match Location
    description: 'The location of the matched data in the source which resulted in the triggered firewall rule. For example: HEADER.'
    type: string
    ocsf_mapping:
      field: firewall_rule.match_location
    is_dimension: false
  - name: firewall_rule_condition
    caption: Condition
    description: 'The rule trigger condition for the rule. For example: SQL_INJECTION.'
    type: string
    ocsf_mapping:
      field: firewall_rule.condition
    is_dimension: false
  - name: class_name
    caption: Class
    description: 'The event class name, as defined by class_uid value: <code>DNS Activity</code>.'
    type: string
    ocsf_mapping:
      field: class_name
    is_dimension: true
  - name: is_alert
    caption: Alert
    description: Indicates that the event is considered to be an alertable signal. Should be set to <code>true</code> if <code>disposition_id = Alert</code> among other dispositions, and/or <code>risk_level_id</code> or <code>severity_id</code> of the event is elevated. Not all control events will be alertable, for example if <code>disposition_id = Exonerated</code> or <code>disposition_id = Allowed</code>.
    type: boolean
    ocsf_mapping:
      field: is_alert
    is_dimension: true
metrics:
- name: peripheral_device_query_count
  caption: Peripheral Device Query Count
  description: Count of Peripheral Device Query events
  aggregation: count
  measure:
    field: metadata.uid
  dimensions:
  - query_info
  - activity_name
  - action
  - attacks
  - risk_level_id
  - status_code
  - confidence_id
  - activity_id
  - type_uid
  - observables
  time_granularities:
  - minute
  - hour
  - day
  is_hot_path: false
- name: peripheral_device_query_avg_duration
  caption: Average Peripheral Device Query Duration
  description: Average duration of Peripheral Device Query events
  aggregation: avg
  measure:
    field: duration
  dimensions:
  - query_info
  - activity_name
  - action
  - attacks
  - risk_level_id
  - status_code
  - confidence_id
  - activity_id
  - type_uid
  - observables
  time_granularities:
  - hour
  - day
  is_hot_path: false
- name: peripheral_device_query_success_rate
  caption: Peripheral Device Query Success Rate
