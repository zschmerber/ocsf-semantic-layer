semantic_models:
- name: dns_event
  description: DNS queries and responses
  model: ref('ocsf_dns_event')
  default_time_dimension: event_time
  entities:
  - name: dns_event
    type: primary
  dimensions:
  - name: query_hostname
    type: categorical
    expr: query.hostname
  - name: query_type
    type: categorical
    expr: query.type
  - name: source_ip
    type: categorical
    expr: src_endpoint.ip
  - name: response_code
    type: categorical
    expr: rcode
  - name: action
    type: categorical
    expr: action
  - name: severity
    type: categorical
    expr: severity
  - name: cloud_provider
    type: categorical
    expr: cloud.provider
  - name: cloud_region
    type: categorical
    expr: cloud.region
  - name: event_time
    type: time
    expr: time
    time_granularity: day
    description: Event timestamp
  measures:
  - name: dns_query_count
    agg: count
    expr: metadata.uid
    description: Total number of DNS queries
    create_metric: true
  - name: blocked_dns_rate
    agg: average
    expr: CASE WHEN action != 'Allowed' THEN 1.0 ELSE 0.0 END
    description: Percentage of blocked DNS queries
    create_metric: true
  - name: dns_by_severity
    agg: count
    expr: metadata.uid
    description: Count of DNS events grouped by severity
    create_metric: true
